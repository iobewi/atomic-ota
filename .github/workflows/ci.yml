name: Rust

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: clippy
      - run: cargo test -p fibewi --all-targets
      - run: cargo clippy -p fibewi --lib -- -D warnings -A clippy::result-unit-err -A clippy::needless-range-loop

  exhaustive:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
      - run: cargo test -p fibewi --release -- --ignored
