name: Rust

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: clippy
      - run: cargo test -p fibewi --all-targets
      - run: cargo test -p fibewi-esp --all-targets
      - run: cargo clippy -p fibewi --lib -- -D warnings
      - run: cargo clippy -p fibewi-esp --lib -- -D warnings -A clippy::result-unit-err -A clippy::needless-range-loop

  esp32c3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          targets: riscv32imc-unknown-none-elf
          components: clippy
      - run: cargo check -p fibewi-esp --features esp32c3 --target riscv32imc-unknown-none-elf
      - run: cargo clippy -p fibewi-esp --features esp32c3 --target riscv32imc-unknown-none-elf -- -D warnings -A clippy::result-unit-err -A clippy::needless-range-loop


  bootloader-esp32c3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: riscv32imc-unknown-none-elf
          components: rust-src
      - run: cd bootloader/esp32c3 && cargo check --release


  exhaustive:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
      - run: cargo test -p fibewi-esp --release -- --ignored
