[package]
name = "fibewi-esp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "ESP backend for FiBeWI firmware update and transactional A/B boot."
repository = "https://github.com/iobewi/fibewi"
keywords = ["esp32", "ota", "bootloader", "embedded", "no-std"]
categories = ["embedded", "hardware-support", "no-std"]

[features]
default = []
esp32c3 = [
  "dep:embedded-storage",
  "dep:esp-bootloader-esp-idf",
  "esp-bootloader-esp-idf/esp32c3",
  "dep:espbewi-partitions",
  "espbewi-partitions/esp32c3",
]
esp32s3 = [
  "dep:embedded-storage",
  "dep:esp-bootloader-esp-idf",
  "esp-bootloader-esp-idf/esp32s3",
  "dep:espbewi-partitions",
  "espbewi-partitions/esp32s3",
]

[dependencies]
fibewi = { path = "../.." }
espbewi-platform = { git = "https://github.com/iobewi/espbewi", rev = "213c44228c7e24ed62a20bbaab3a822c6cdf6506", package = "espbewi-platform" }
sha2 = { version = "0.10", default-features = false }
embedded-storage = { version = "0.3.1", optional = true }
esp-bootloader-esp-idf = { version = "0.5.0", default-features = false, optional = true }
espbewi-partitions = { git = "https://github.com/iobewi/espbewi", rev = "213c44228c7e24ed62a20bbaab3a822c6cdf6506", package = "espbewi-partitions", optional = true }
